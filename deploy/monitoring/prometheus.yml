# Prometheus for kia's monitoring profile (docs/cookbooks/observability.md).
# Your own extra targets go in monitoring/targets/*.yml in the kia folder (example below).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # kia's numbers (docs/metrics.md), straight from kia on Docker's network.
  - job_name: kia
    static_configs:
      - targets: ["kia:8781"]

  # Each container's processor, memory, and network: kia, web, the Threadfins, Plex, Jellyfin,
  # Prometheus, and Grafana.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    # cAdvisor labels each container with all of its labels (dozens, from the image and
    # Compose). The dashboards use two, so only those are kept: copied aside, the rest
    # dropped, then copied back.
    metric_relabel_configs:
      - action: labelmap
        regex: container_label_com_docker_compose_(project|service)
        replacement: kia_compose_${1}
      - action: labeldrop
        regex: container_label_.+
      - action: labelmap
        regex: kia_compose_(project|service)
        replacement: container_label_com_docker_compose_${1}
      - action: labeldrop
        regex: kia_compose_.+

  # The computer itself, from node-exporter on port 9100: the monitoring-node profile,
  # or one you already run (Ubuntu's prometheus-node-exporter package, for example).
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The graphics card and the disks' health: the monitoring-gpu and monitoring-disks
  # profiles. Prometheus looks for them by name on Docker's network every few minutes, so
  # without those profiles they're simply not there (rather than "down"), and the Hardware
  # dashboard's sections for them stay empty.
  - job_name: gpu
    dns_sd_configs:
      - names: ["dcgm-exporter"]
        type: A
        port: 9400
        refresh_interval: 2m
  - job_name: disks
    scrape_interval: 2m  # SMART data changes slowly; the exporter reads the disks once a minute
    dns_sd_configs:
      - names: ["smartctl-exporter"]
        type: A
        port: 9633
        refresh_interval: 2m

  # Anything else, such as a Plex exporter or another kia, one file per job:
  #   monitoring/targets/plex.yml
  #   - targets: ["host.docker.internal:9000"]
  #     labels:
  #       job: plex
  - job_name: extra
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
