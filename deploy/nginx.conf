# Serves the output folder: curated.m3u, guide.xml(.gz), and the reports.
server {
    listen 80;
    root /srv/output;
    charset utf-8;
    autoindex on;
    server_tokens off;
    # Serve only real files in output/, never what a link inside it points to.
    disable_symlinks on;

    # Clients should always re-check; the guide changes several times a day.
    add_header Cache-Control "no-cache";

    # The status page's profile editor, answered by kia (port 8781 isn't published).
    # The resolver finds kia again after it restarts with a new address.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $kia http://kia:8781;
        proxy_pass $kia;
        proxy_set_header Host $http_host;
        client_max_body_size 64k;
    }

    # Don't serve files that a run is still writing.
    location ~ \.tmp$ {
        return 404;
    }

    location ~ \.m3u8?$ {
        types { }
        default_type audio/x-mpegurl;
    }

    location ~ \.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }
}
