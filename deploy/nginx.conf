# Two ports, one set of files (output/):
#   HTTP (80, published as KIA_PORT, 8780): playlists and guides for Kodi and other players,
#     which refuse self-signed certificates, plus a read-only Dashboard.
#   HTTPS (443, published as KIA_HTTPS_PORT, 8743): the Dashboard, where changes are made.
# kia accepts changes (/api/) only when this file says they came over HTTPS.

server {
    listen 80;
    include /etc/nginx/conf.d/kia-common.inc;

    location /api/ {
        include /etc/nginx/conf.d/kia-api.inc;
        proxy_set_header X-Kia-Secure "0";
    }
}

server {
    listen 443 ssl;
    http2 on;
    # tls/ in the kia folder. kia makes a self-signed certificate; your own replaces these
    # two files. nginx reloads within a minute of a change (deploy/nginx-tls.sh).
    ssl_certificate /etc/kia-tls/fullchain.pem;
    ssl_certificate_key /etc/kia-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:kia:1m;
    include /etc/nginx/conf.d/kia-common.inc;

    location /api/ {
        include /etc/nginx/conf.d/kia-api.inc;
        proxy_set_header X-Kia-Secure "1";
    }
}
