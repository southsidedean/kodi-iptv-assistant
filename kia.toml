# kia settings. The defaults suit most people; each setting says what it does and when
# you might change it. With Docker, the most common ones can also be set in .env, which
# takes priority over this file (the .env name is given where one exists).

# The playlists to check, one per line. See the comments in that file.
sources_file = "sources.txt"

# Playlists for people and devices, made from the full list. The Dashboard edits this
# file; it must be in the profiles/ folder, the one kia may write. See docs/profiles.md.
# .env: KIA_PROFILES_FILE
profiles_file = "profiles/profiles.toml"


[check]
# How kia tests each stream.

# Streams tested at the same time. Lower it on a Raspberry Pi or a slow connection.
# .env: KIA_CHECK_CONCURRENCY
concurrency = 20

# Streams tested at the same time on any one server. Many servers, radio especially,
# turn away more than a couple of connections from the same place.
per_host = 2
# Servers that allow more. jmp2.uk carries the Pluto TV, Samsung TV Plus, and Plex
# channels (about 750 streams on a USA setup); at 6 its share of the check took a third
# of the time, with no extra failures.
per_host_limits = { "jmp2.uk" = 6 }
# Milliseconds between starting two tests on the same server. Bursts of requests can set
# off a site's firewall; other servers aren't held up.
host_delay_ms = 100

# Seconds to wait for a stream before giving up on it.
timeout = 15

# Only keep TV streams that have video. Radio stations are always allowed audio only.
require_video = true

# A stream that has worked before stays in the list through this many failed nightly
# checks in a row, and is dropped after the next one. Free streams often drop out for a
# while and come back.
grace_failures = 2

# Join the same channel from different playlists into one, by exact name. It keeps the
# id, logo, and channel number of its copy in the earliest playlist in your sources list,
# and plays whichever copy's stream tested best.
merge_duplicates = true

# Forget the history of streams that haven't been in any playlist for this many days.
history_days = 30

# How kia introduces itself to stream servers. VLC is accepted most widely; some servers
# refuse Kodi, so kia writes the same identity into the playlist for Kodi to use. A
# playlist entry's own setting wins. "" tests as ffmpeg and leaves Kodi's identity alone.
# user_agent = "VLC/3.0.20 LibVLC/3.0.20"


[filters]
# Channels to leave out before testing.

# Categories (the "group-title" in iptv-org playlists), e.g. ["Religious", "Shop"].
# .env: KIA_EXCLUDE_GROUPS (adds to this list)
exclude_groups = []

# Tags in square brackets at the end of channel names, e.g. ["Not 24/7", "Geo-blocked"].
exclude_labels = []

# Regular expressions matched against channel names, e.g. ["\\bshop"].
# Upper and lower case are treated the same.
exclude_name_patterns = []


[output]
# Where results go. output/ is what the web server shares with Kodi. With Docker, leave
# these folder settings (and repo_dir and work_dir under [epg]) as they are: they're the
# only folders kia is allowed to write to.
dir = "output"
state_dir = "state"

# The address Kodi uses to reach this machine. Docker sets it from KIA_PUBLIC_URL in .env.
# kia writes the guide's address into the playlist from it, so Kodi finds the guide itself.
# public_url = "http://my-server.lan:8780"

# Give each channel a number (tvg-chno) that it keeps from night to night, instead of
# its place in the list. Kodi shows them once "Use channel numbers from backend" is on
# (see docs/kodi.md). To number everything 1, 2, 3 again, once: kia renumber, or
# "Renumber" on the secure Dashboard.
channel_numbers = true

# A channel that's gone keeps its number, which isn't reused, so numbers climb and the
# list gets gaps. Set this to reuse the number of a channel last seen this many days ago
# (60 or more; 90 is a good choice). 0 never reuses numbers.
recycle_numbers_after_days = 0

# Only if your guide is served from somewhere else:
# epg_url = "http://my-server.lan:8780/guide.xml.gz"


[dns]
# When a stream's server name can't be looked up on this machine, kia asks these public
# DNS servers as well. If they can find it, the problem is your network's DNS (and kia
# raises an alert); if they can't, the stream is gone.
verify_resolvers = ["8.8.8.8", "1.1.1.1"]


[alerts]
# Notifications for problems that need you. See docs/alerts.md.
# Alerts are always written to state/alerts.log. To also get them on your phone, set
# ntfy_url or command. With Docker, use KIA_NTFY_URL and KIA_ALERT_COMMAND in .env
# instead, so your topic name stays out of this file.

# ntfy topic address. Pick a long, hard-to-guess topic name: anyone who knows it can
# read the messages.
# ntfy_url = "https://ntfy.sh/my-long-random-topic"

# Any shell command, run once per alert with $KIA_ALERT_EVENT, $KIA_ALERT_TITLE, and
# $KIA_ALERT_MESSAGE set.
# command = ""

# Which events notify you. .env: KIA_ALERT_EVENTS (comma-separated, replaces this list)
#   dns_local      your network's DNS is failing
#   run_failed     the nightly refresh failed or crashed
#   channels_drop  working channels fell sharply since the last run
#   guide_drop     channels with guide data fell sharply since the last run
#   site_failing   a guide site failed several runs in a row
#   daily_summary  an "all done" message after each run (off unless you add it)
events = ["dns_local", "run_failed", "channels_drop", "guide_drop", "site_failing"]

# How big a fall, in percent, counts as sharp for channels_drop and guide_drop.
drop_percent = 25

# Failed runs in a row before site_failing alerts. You hear about it once per streak.
site_fail_runs = 3


[epg]
# Building the program guide. See docs/how-it-works.md.

# Days of program guide to download. More days take longer and use more memory.
# .env: KIA_EPG_DAYS
days = 3

# Guide sites downloaded at the same time. Each one uses up to about 0.7 GB of memory.
# .env: KIA_PARALLEL_SITES
parallel_sites = 4

# Requests at the same time to any one guide site. Some sites need their own number, and
# a pause between requests (in milliseconds): tvpassport.com handles 100 at once, while
# plex.tv turns requests away unless they come one at a time, slowly.
max_connections = 5
site_connections = { "tvpassport.com" = 100, "plex.tv" = 1 }
site_delay_ms = { "tvpassport.com" = 100, "plex.tv" = 100 }

# Guide sites to try for each channel. kia keeps whichever has the most listings.
max_sites_per_channel = 3

# Sites to try first, in order, e.g. ["pluto.tv", "plex.tv"].
prefer_sites = []

# Sites never to use. Sites marked broken by iptv-org are skipped anyway.
# epg.iptvx.one needs more than 4 GB of memory, even for a few channels.
# ontvtonight.com sends programs without titles (October 2026), so it adds nothing.
# .env: KIA_EXCLUDE_SITES (adds to this list)
exclude_sites = ["epg.iptvx.one", "ontvtonight.com"]

# Minutes a guide site may take before kia stops it and keeps its previous guide, so one
# site that hangs can't hold up the whole run. tvpassport.com can take 15. 0 = no limit.
site_time_limit = 30

# When a TV channel has no guide data, or its listings end early, fill the rest of its
# row with blocks showing the channel's name, so the guide has no gaps. .env: KIA_PLACEHOLDERS
placeholders = true
# Block length in hours: 1, 2, 3, 4, 6, 8, 12, or 24.
placeholder_hours = 2
# Do the same for radio stations. Off by default; almost no station has guide data, so
# turning it on fills Kodi's radio guide with station names. .env: KIA_RADIO_PLACEHOLDERS
radio_placeholders = false

# When no guide site lists a channel's id, look for a site channel with exactly the same
# name in the same country. The matches are listed in mapping-report.html. If one shows
# another channel's programs, add its tvg-id to ignore_name_matches, e.g. ["News12.us@SD"].
name_matching = true
ignore_name_matches = []
# Looser matches listed under "Possible matches" in mapping-report.html aren't used. To
# use one you've checked, add its tvg-id here, e.g. ["CBNNews.us@SD"].
accept_name_matches = []

# Use the guide a playlist names in its first line (x-tvg-url) for that playlist's
# channels, e.g. the Samsung TV Plus list in sources.txt.
playlist_guides = true

# Read some guides directly instead of through iptv-org's downloader: i.mjh.nz's files
# (Pluto TV, Plex, Samsung TV Plus, Roku), KINK's schedule on kink.nl, and KEXP's on kexp.org. For i.mjh.nz
# that takes seconds and little memory, instead of about 25 minutes and over 2 GB.
native_grabbers = true

# Where kia keeps its copy of iptv-org/epg and its working files.
repo_dir = "vendor/epg"
work_dir = "work"

# Use a fork or a fixed version of iptv-org/epg. "latest" follows its main branch, which
# is updated every few days with fixes for guide sites. A tag or commit pins a version you
# have checked. .env: KIA_EPG_GIT_URL, KIA_EPG_GIT_REF
# git_url = "https://github.com/iptv-org/epg.git"
# git_ref = "latest"

# How the guide downloader runs: "docker", or "local" if Node.js 22+ is installed.
# The Docker image always uses its own built-in Node.js.
runner = "docker"
# The image "docker" uses. The default follows the latest Node.js LTS release.
# docker_image = "node:lts-alpine"


[upstream]
# For laptops and other machines with a home kia server: copy the guide from it instead
# of downloading guide data here. Streams are still tested locally. See docs/setups.md.
# .env: KIA_UPSTREAM_URL, KIA_UPSTREAM_FALLBACK
# url = "http://my-server.lan:8780"

# If the home server can't be reached: "grab" the guide here, or reuse the "cached" copy.
fallback = "grab"


[pluto]
# Pluto TV channels play through kia, which keeps them going across ad breaks; without
# it, most players freeze or jump back at a break. kia opens its own Pluto session for
# each channel being watched and hands players a steady stream. See docs/how-it-works.md.
# .env: KIA_PLUTO_RELAY
relay = true
