# Runs kia and a small web server that shares output/ with Kodi.
# Settings come from .env: copy .env.example to .env, edit it, then run
#   docker compose up -d --build
#
# Both containers run locked down: no extra privileges, a read-only system, and write
# access only to the folders they need. kia runs iptv-org's guide downloader, which is
# third-party code, so it can't change kia's own files or settings.
# Each container keeps at most 3 log files of 10 MB (KIA_LOG_MAX_SIZE, KIA_LOG_MAX_FILES);
# without a limit, Docker keeps every line until the container is recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${KIA_LOG_MAX_SIZE:-10m}
    max-file: "${KIA_LOG_MAX_FILES:-3}"

services:
  kia:
    build:
      context: .
      args:
        BASE_IMAGE: ${KIA_BASE_IMAGE:-cgr.dev/chainguard/wolfi-base:latest}
        NODE_VERSION: ${KIA_NODE_VERSION:-24}
    # Built here by default. KIA_IMAGE can name kia's published image instead, e.g.
    # ghcr.io/southsidedean/kodi-iptv-assistant:latest (docs/configuration.md, "Versions").
    image: ${KIA_IMAGE:-kodi-iptv-assistant:latest}
    restart: unless-stopped
    logging: *logging
    # A small init as process 1 cleans up after the stream tests (ffprobe) a stopped
    # "Check now" leaves behind; kia itself doesn't.
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
      # Other programs' data in the kia folder, which kia never reads: empty in kia's view,
      # so a stream that broke ffprobe couldn't reach Jellyfin's users or the password Grafana
      # made. The rest of the kia folder stays readable, because kia needs it: .env, with any
      # passwords set there (KIA_GRAFANA_PASSWORD, say), and with Plex in the stack, Plex's
      # settings, which hold its sign-in, and Threadfin's (kia doctor reads which playlist it
      # uses), with the password for its page.
      - /data/jellyfin:size=1m,mode=0500
      - /data/monitoring:size=1m,mode=0500
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      KIA_PUBLIC_URL: ${KIA_PUBLIC_URL:-}
      KIA_NAME: ${KIA_NAME:-}
      KIA_SOURCES_FILE: ${KIA_SOURCES_FILE:-}
      KIA_PROFILES_FILE: ${KIA_PROFILES_FILE:-}
      KIA_RUN_ON_START: ${KIA_RUN_ON_START:-}
      KIA_GUIDE_REFRESH_HOURS: ${KIA_GUIDE_REFRESH_HOURS:-}
      KIA_UPSTREAM_URL: ${KIA_UPSTREAM_URL:-}
      KIA_UPSTREAM_FALLBACK: ${KIA_UPSTREAM_FALLBACK:-}
      KIA_NTFY_URL: ${KIA_NTFY_URL:-}
      KIA_ALERT_COMMAND: ${KIA_ALERT_COMMAND:-}
      KIA_ALERT_EVENTS: ${KIA_ALERT_EVENTS:-}
      KIA_SMTP_HOST: ${KIA_SMTP_HOST:-}
      KIA_SMTP_PORT: ${KIA_SMTP_PORT:-}
      KIA_SMTP_SECURITY: ${KIA_SMTP_SECURITY:-}
      KIA_SMTP_USER: ${KIA_SMTP_USER:-}
      KIA_SMTP_PASSWORD: ${KIA_SMTP_PASSWORD:-}
      KIA_EMAIL_FROM: ${KIA_EMAIL_FROM:-}
      KIA_EMAIL_TO: ${KIA_EMAIL_TO:-}
      KIA_PLUTO_RELAY: ${KIA_PLUTO_RELAY:-}
      # kia plex-tuners: where Plex is, and where it finds the Threadfins.
      KIA_PLEX_URL: ${KIA_PLEX_URL:-}
      KIA_PLEX_TOKEN: ${KIA_PLEX_TOKEN:-}
      # Jellyfin's sessions in /metrics (docs/metrics.md): where Jellyfin is, and an API key.
      KIA_JELLYFIN_URL: ${KIA_JELLYFIN_URL:-}
      KIA_JELLYFIN_TOKEN: ${KIA_JELLYFIN_TOKEN:-}
      # The Dashboard's Observability button (docs/cookbooks/observability.md).
      KIA_GRAFANA_URL: ${KIA_GRAFANA_URL:-}
      KIA_GRAFANA_PORT: ${KIA_GRAFANA_PORT:-}
      # kia doctor hardware (and the Dashboard's and MCP's hardware checks): a Prometheus of your own.
      KIA_PROMETHEUS_URL: ${KIA_PROMETHEUS_URL:-}
      KIA_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      KIA_STACK: ${KIA_STACK:-}
      # The Dashboard's Stack tiles link to these (src/kia/stack.py).
      KIA_THREADFIN_PORT: ${KIA_THREADFIN_PORT:-}
      KIA_THREADFIN_2_PORT: ${KIA_THREADFIN_2_PORT:-}
      KIA_PLEX_PORT: ${KIA_PLEX_PORT:-}
      KIA_JELLYFIN_PORT: ${KIA_JELLYFIN_PORT:-}
      # The gateway part (scripts/gateway.sh): its port, for the setups kia prints, and each
      # device's limit, for kia settings.
      KIA_GATEWAY_PORT: ${KIA_GATEWAY_PORT:-}
      KIA_GATEWAY_RATE: ${KIA_GATEWAY_RATE:-}
      # The front-door part (scripts/frontdoor.sh): its two host names and port, for the
      # address kia shows.
      KIA_FRONTDOOR_HOST: ${KIA_FRONTDOOR_HOST:-}
      KIA_FRONTDOOR_AUTH_HOST: ${KIA_FRONTDOOR_AUTH_HOST:-}
      KIA_FRONTDOOR_PORT: ${KIA_FRONTDOOR_PORT:-}
      # On: the Dashboard lets the front door's admin edit without kia's own password.
      KIA_TRUST_FRONTDOOR: ${KIA_TRUST_FRONTDOOR:-}
      # The chat page (the chat part, docs/chat.md). kia runs the chat loop and reaches the
      # gateway's AI route on the gateway's own network; the provider's key stays in the gateway.
      # KIA_CHAT_PROVIDER_KEY and KIA_CHAT_BUDGET are read by scripts/gateway.sh, not kia.
      KIA_CHAT: ${KIA_CHAT:-}
      KIA_CHAT_URL: ${KIA_CHAT_URL:-http://gateway:4000/v1/messages}
      KIA_CHAT_MODEL: ${KIA_CHAT_MODEL:-}
      KIA_CHAT_MODEL_HEAVY: ${KIA_CHAT_MODEL_HEAVY:-}
      KIA_CHAT_MAX_TOKENS: ${KIA_CHAT_MAX_TOKENS:-}
      KIA_CHAT_THINKING: ${KIA_CHAT_THINKING:-}
      KIA_CHAT_ACTIONS: ${KIA_CHAT_ACTIONS:-}
      KIA_CHAT_BUDGET: ${KIA_CHAT_BUDGET:-}
      # Optional; empty means use the setting in kia.toml.
      KIA_EPG_DAYS: ${KIA_EPG_DAYS:-}
      KIA_PARALLEL_SITES: ${KIA_PARALLEL_SITES:-}
      KIA_CHECK_CONCURRENCY: ${KIA_CHECK_CONCURRENCY:-}
      KIA_EXCLUDE_SITES: ${KIA_EXCLUDE_SITES:-}
      KIA_EXCLUDE_GROUPS: ${KIA_EXCLUDE_GROUPS:-}
      KIA_PLACEHOLDERS: ${KIA_PLACEHOLDERS:-}
      KIA_RADIO_PLACEHOLDERS: ${KIA_RADIO_PLACEHOLDERS:-}
      KIA_EPG_GIT_URL: ${KIA_EPG_GIT_URL:-}
      KIA_EPG_GIT_REF: ${KIA_EPG_GIT_REF:-}
      # Editing on the secure Dashboard: the password (kia makes one if this is empty),
      # editing on or off, the secure port, and the names its certificate covers.
      KIA_ADMIN_PASSWORD: ${KIA_ADMIN_PASSWORD:-}
      KIA_EDITING: ${KIA_EDITING:-}
      KIA_HTTPS_PORT: ${KIA_HTTPS_PORT:-8743}
      KIA_TLS_NAMES: ${KIA_TLS_NAMES:-}
      # nginx (another user) reads kia's certificate key from tls/, through your group.
      KIA_TLS_SHARED: "true"
      # Only requests from the web server may say they came through the secure page: its
      # addresses on both networks it shares with kia (web's aliases below).
      KIA_PROXY_HOST: web,web-default,web-gateway
      # nginx forwards /api/ and /pluto/ to this port (not published).
      KIA_API_PORT: "8781"
    # Hard cap so a runaway guide grabber is killed instead of exhausting the host.
    mem_limit: ${KIA_MEMORY_LIMIT:-4g}
    # Processes and threads at once: a full refresh peaks under 100 (measured for 0.7.6), so
    # this leaves room for more streams or sites at once, and stops a program run wild (a
    # stream that broke ffmpeg, say) from starting thousands.
    pids_limit: 1024
    command: ["daemon", "--at", "${KIA_RUN_AT:-04:00}"]
    # The gateway's network too, so the Stack tiles can tell whether the gateway answers.
    networks: [default, gateway]
    # Healthy while kia's own server (the profile editor and Pluto relay) answers.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8781/api/profiles', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # The project folder (kia.toml, your sources file, local playlists) is read-only.
      - ./:/data:ro
      # The folders kia writes to.
      - ./output:/data/output
      - ./state:/data/state
      - ./work:/data/work
      - ./vendor:/data/vendor
      # Profiles, so the Dashboard can save them.
      - ./profiles:/data/profiles
      # The secure Dashboard's certificate (kia makes and renews its own).
      - ./tls:/data/tls
      # A short clip kia plays through Plex in the stack once, so Plex downloads its codecs.
      - ./plex/warmup:/data/plex/warmup
      # Plex's settings, where kia reads the token Plex in the stack saved when it was
      # claimed (also when KIA_PLEX_CONFIG is another folder or a Docker volume).
      - ${KIA_PLEX_CONFIG:-./plex/config}:/data/plex/config:ro

  web:
    image: ${KIA_NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    # nginx starts as root to open the port, then switches to its own user. It joins your
    # group, so it can read the certificate key, which no one else on the computer can.
    group_add: ["${PGID:-1000}"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # nginx uses about 15 MB and a process for each processor; these leave plenty of room.
    mem_limit: 256m
    pids_limit: 256
    ports:
      # KIA_BIND=127.0.0.1 keeps the server to this machine (e.g. Kodi on the same laptop).
      - "${KIA_BIND:-0.0.0.0}:${KIA_PORT:-8780}:80"
      # The secure Dashboard, for making changes.
      - "${KIA_BIND:-0.0.0.0}:${KIA_HTTPS_PORT:-8743}:443"
    depends_on:
      - kia
    # The gateway part reaches kia's MCP server through this server, on the gateway's network.
    # A name on each network, so kia can look up both of its addresses (KIA_PROXY_HOST).
    networks:
      default:
        aliases: [web-default]
      gateway:
        aliases: [web-gateway]
    # Healthy while nginx serves the Dashboard.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # The results, its own settings, and the certificate and key; nothing else in the kia
      # folder is visible to the web server.
      - ./output:/srv/output:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/kia-common.inc:/etc/nginx/conf.d/kia-common.inc:ro
      - ./deploy/kia-api.inc:/etc/nginx/conf.d/kia-api.inc:ro
      - ./deploy/nginx-tls.sh:/docker-entrypoint.d/90-kia-tls.sh:ro
      - ./tls:/etc/kia-tls:ro

  # Writes each Threadfin's first settings (kia's playlist and guide, a filter for every
  # channel, XEPG, FFmpeg options), then exits. Settings that already exist are left alone.
  threadfin-setup:
    profiles: ["plex", "plex-2"]
    build:  # kia's own image (built once, shared with the kia service)
      context: .
      args:
        BASE_IMAGE: ${KIA_BASE_IMAGE:-cgr.dev/chainguard/wolfi-base:latest}
        NODE_VERSION: ${KIA_NODE_VERSION:-24}
    image: ${KIA_IMAGE:-kodi-iptv-assistant:latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KIA_THREADFIN_PLAYLIST: ${KIA_THREADFIN_PLAYLIST:-}
      KIA_THREADFIN_2_PLAYLIST: ${KIA_THREADFIN_2_PLAYLIST:-}
      KIA_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    command: ["threadfin-setup"]
    restart: "no"
    logging: *logging
    tmpfs:
      # As in kia's container: other programs' data stays out of view.
      - /data/jellyfin:size=1m,mode=0500
      - /data/monitoring:size=1m,mode=0500
    volumes:
      - ./:/data:ro
      - ./threadfin/conf:/data/threadfin/conf
      - ./threadfin-2/conf:/data/threadfin-2/conf

  # Optional: Threadfin shows kia's playlist and guide to Plex as a TV tuner, which is how
  # Plex does live TV (docs/plex.md). To start it with kia, add COMPOSE_PROFILES=plex to
  # .env, then run docker compose up -d. It reads kia's files over Docker's own network
  # (http://web/...), so its settings keep working if this computer's address changes.
  # Its settings live in threadfin/.
  threadfin:
    profiles: ["plex"]
    image: ${KIA_THREADFIN_IMAGE:-fyb3roptik/threadfin:1.2.37}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_THREADFIN_PORT:-34400}:34400"
    depends_on:
      web:
        condition: service_started
      threadfin-setup:
        condition: service_completed_successfully
    mem_limit: 1g
    # Healthy while Threadfin answers on its port (its image has no curl or wget).
    healthcheck:
      # Threadfin listens on the container's own address, not 127.0.0.1.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/$$(hostname -i | cut -d' ' -f1)/34400"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./threadfin/conf:/home/threadfin/conf
      - ./threadfin/cache:/home/threadfin/cache

  # A second Plex tuner, for more channels than one tuner takes (Plex takes at most 480
  # from each). Start both with COMPOSE_PROFILES=plex,plex-2 in .env.
  threadfin-2:
    profiles: ["plex-2"]
    image: ${KIA_THREADFIN_IMAGE:-fyb3roptik/threadfin:1.2.37}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_THREADFIN_2_PORT:-34401}:34400"
    depends_on:
      web:
        condition: service_started
      threadfin-setup:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      # Threadfin listens on the container's own address, not 127.0.0.1.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/$$(hostname -i | cut -d' ' -f1)/34400"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./threadfin-2/conf:/home/threadfin/conf
      - ./threadfin-2/cache:/home/threadfin/cache

  # Optional: Plex Media Server itself, for a home TV box with everything in one place
  # (docs/cookbooks/plex-box.md). Start it with COMPOSE_PROFILES=plex,plex-server in .env.
  # Its settings and database live in plex/config (or KIA_PLEX_CONFIG), so they survive
  # restarts and updates; your media folder (KIA_MEDIA_DIR) is read-only to it.
  plex:
    profiles: ["plex-server"]
    image: ${KIA_PLEX_IMAGE:-plexinc/pms-docker:latest}
    # Plex names the server after this; it shows in every Plex app.
    hostname: ${KIA_PLEX_NAME:-kia-tv-box}
    restart: unless-stopped
    logging: *logging
    # Plex's image starts as root to set itself up, then runs Plex as PUID. It keeps only
    # what that takes: owning and switching to its files and user, and stopping its own
    # processes cleanly (without KILL, a stop waits and then cuts Plex off mid-write).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    environment:
      TZ: ${TZ:-UTC}
      # From https://plex.tv/claim, on the first start only; it links this Plex to your
      # account. It works for 4 minutes, and isn't needed again.
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # The address Plex apps on your network use to reach it.
      ADVERTISE_IP: ${KIA_PLEX_ADVERTISE:-}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_PLEX_PORT:-32400}:32400"
    volumes:
      - ${KIA_PLEX_CONFIG:-./plex/config}:/config
      - ${KIA_PLEX_TRANSCODE:-./plex/transcode}:/transcode
      - ${KIA_MEDIA_DIR:-./media}:/data:ro
      - ./plex/warmup:/kia-warmup:ro

  # Optional: Jellyfin, free software for your media and live TV, as a home TV box with
  # everything in one place (docs/cookbooks/jellyfin-box.md). Start it with
  # COMPOSE_PROFILES=jellyfin-server in .env. It reads kia's playlist and guide from the web
  # server directly, so it needs no Threadfin. Its settings and database live in
  # jellyfin/config (or KIA_JELLYFIN_CONFIG); your media folder (KIA_MEDIA_DIR) is read-only.
  jellyfin:
    profiles: ["jellyfin-server"]
    image: ${KIA_JELLYFIN_IMAGE:-jellyfin/jellyfin:latest}
    # Jellyfin suggests this as the server's name in its setup; it shows in every Jellyfin app.
    hostname: ${KIA_JELLYFIN_NAME:-kia-tv-box}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
      # The address Jellyfin apps on your network use to reach it.
      JELLYFIN_PublishedServerUrl: ${KIA_JELLYFIN_ADVERTISE:-}
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ${KIA_JELLYFIN_CONFIG:-./jellyfin/config}:/config
      - ${KIA_JELLYFIN_CACHE:-./jellyfin/cache}:/cache
      - ${KIA_MEDIA_DIR:-./media}:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Monitoring (docs/cookbooks/observability.md) ------------------------------------
  # COMPOSE_PROFILES=...,monitoring adds Prometheus, Grafana, and cAdvisor; monitoring-node
  # adds node-exporter, unless this computer already runs one on port 9100.

  prometheus:
    profiles: ["monitoring"]
    image: ${KIA_PROMETHEUS_IMAGE:-prom/prometheus:latest}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${KIA_PROMETHEUS_RETENTION:-30d}
    # node-exporter listens on this computer itself, outside Docker's network.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Prometheus's own page has no password, so it's open to this computer only.
    ports:
      - "127.0.0.1:${KIA_PROMETHEUS_PORT:-8789}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - ${KIA_PROMETHEUS_DATA:-./monitoring/prometheus}:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 1m
      timeout: 10s

  grafana:
    profiles: ["monitoring"]
    image: ${KIA_GRAFANA_IMAGE:-grafana/grafana:latest}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # kia makes the HTTPS certificate when it starts; Grafana reads it from tls/.
    depends_on:
      prometheus:
        condition: service_started
      kia:
        condition: service_healthy
    # The admin password: KIA_GRAFANA_PASSWORD, or else a random one made on the first start
    # and saved in monitoring/grafana/admin-password.txt. Never Grafana's default "admin".
    # Grafana reads it only when it sets itself up, the first time it starts.
    entrypoint:
      - /bin/sh
      - -c
      - |
        f=/var/lib/grafana/admin-password.txt
        if [ -z "$$KIA_GRAFANA_PASSWORD" ]; then
          [ -s "$$f" ] || (umask 077; head -c 18 /dev/urandom | base64 | tr -d '/+=' > "$$f")
          KIA_GRAFANA_PASSWORD=$$(cat "$$f")
        fi
        export GF_SECURITY_ADMIN_PASSWORD="$$KIA_GRAFANA_PASSWORD"
        unset KIA_GRAFANA_PASSWORD
        exec /run.sh "$$@"
      - grafana
    environment:
      TZ: ${TZ:-UTC}
      KIA_GRAFANA_PASSWORD: ${KIA_GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 installs and updates plugins by itself in the background. Updating a
      # bundled one (Prometheus's) means deleting it from Grafana's read-only system, which
      # fails after Grafana has dropped it, and every dashboard goes empty. kia's dashboards
      # need only the bundled Prometheus plugin; a new image brings its updates.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # HTTPS only, with kia's own certificate (the secure Dashboard's, in tls/), or yours if
      # you put one there. Grafana checks the files every minute, so a renewal needs no restart.
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/kia-tls/fullchain.pem
      GF_SERVER_CERT_KEY: /etc/kia-tls/privkey.pem
      GF_SERVER_CERTS_WATCH_INTERVAL: 1m
      # Grafana's login cookie: only over HTTPS (browsers send a cookie to every port of a
      # computer, kia's plain-http ones too) and not with requests from other sites.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/kia/kia.json
      # A soft memory budget: Grafana gives memory back sooner (it peaks around 1 GB on its first start).
      GOMEMLIMIT: 384MiB
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_GRAFANA_PORT:-8788}:3000"
    volumes:
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/dashboards:/etc/grafana/dashboards/kia:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards/local:ro
      - ${KIA_GRAFANA_DATA:-./monitoring/grafana}:/var/lib/grafana
      - ./tls:/etc/kia-tls:ro

  cadvisor:
    profiles: ["monitoring"]
    image: ${KIA_CADVISOR_IMAGE:-ghcr.io/google/cadvisor:latest}
    restart: unless-stopped
    logging: *logging
    # It reads Docker's socket to name the containers, which is as good as full access to
    # this computer, so it gets nothing else: a read-only system and no capabilities. A new
    # Docker install keeps its images in containerd, where cAdvisor finds the containers only
    # through containerd's socket (Docker's own namespace, moby); older installs work either way.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Docker containers only, every 30 seconds, with only the numbers the dashboards use:
    # it costs far less processor time that way. (Prometheus keeps only the two container
    # labels the dashboards use; cAdvisor's own label filter drops them all for containers
    # it finds through containerd.)
    command:
      - --docker_only=true
      - --containerd-namespace=moby
      - --housekeeping_interval=30s
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    profiles: ["monitoring-node"]
    image: ${KIA_NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    restart: unless-stopped
    logging: *logging
    # On this computer's own network and processes, to see them rather than a container's.
    network_mode: host
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Every address of this computer by default, so Prometheus's container reaches it. With
    # KIA_NODE_EXPORTER_LISTEN set to Docker's own address (usually 172.17.0.1:9100), the rest
    # of your network can't read it.
    command: ["--path.rootfs=/host", "--web.listen-address=${KIA_NODE_EXPORTER_LISTEN:-:9100}"]
    volumes:
      - /:/host:ro,rslave

  # The graphics card, for the Hardware dashboard: its load, its video encoder and decoder
  # (what Plex uses when it converts video on the card), temperature, power, and memory.
  # NVIDIA cards only, with NVIDIA's Container Toolkit installed; COMPOSE_PROFILES=...,monitoring-gpu.
  dcgm-exporter:
    profiles: ["monitoring-gpu"]
    image: ${KIA_DCGM_IMAGE:-nvidia/dcgm-exporter:4.6.1-4.8.4}
    restart: unless-stopped
    logging: *logging
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
    # Its standard numbers need no extra privileges.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The disks' own health (SMART), for the Hardware dashboard: failing sectors, errors,
  # temperature, and wear; COMPOSE_PROFILES=...,monitoring-disks. Reading SMART data takes
  # the disks themselves, so this one runs privileged, as root: full access to the computer.
  # It gets nothing else, and no published port: on Docker's network, only Prometheus asks
  # it for anything, though any container there could.
  smartctl-exporter:
    profiles: ["monitoring-disks"]
    image: ${KIA_SMARTCTL_IMAGE:-quay.io/prometheuscommunity/smartctl-exporter:latest}
    restart: unless-stopped
    logging: *logging
    privileged: true
    user: root
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # The gateway in front of kia's MCP server (agentgateway; the gateway part, docs/mcp.md):
  # a key for each device, a limit for each, and a log of every call. scripts/gateway.sh
  # writes its settings into gateway/, with the gateway's own token for kia. It's on a
  # network of its own with only kia and its web server, and reaches kia's MCP server through
  # the web server over HTTPS, like any assistant. Its image is a single program, with no
  # shell, so there's no health check: the Stack tile knocks on its port.
  gateway:
    profiles: ["gateway"]
    image: ${KIA_GATEWAY_IMAGE:-ghcr.io/agentgateway/agentgateway:v1.7.0}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["-f", "/gateway/config.yaml"]
    networks: [gateway]
    depends_on:
      - web
    ports:
      - "${KIA_BIND:-0.0.0.0}:${KIA_GATEWAY_PORT:-8745}:8745"
      # The front door's login listener (the frontdoor part). Nothing listens on it until the
      # front door is on, when scripts/gateway.sh adds its listener to the config.
      - "${KIA_BIND:-0.0.0.0}:${KIA_FRONTDOOR_PORT:-8444}:8444"
    environment:
      # The AI provider's key for the chat page (the chat part, docs/chat.md). The gateway's
      # config refers to it by name, so the key itself never goes into gateway/config.yaml. Empty
      # unless the chat is on.
      KIA_CHAT_PROVIDER_KEY: ${KIA_CHAT_PROVIDER_KEY:-}
    # The gateway's OIDC session cookie key, written by scripts/gateway.sh when the front door
    # is on. Optional, so the gateway still starts without the front door.
    env_file:
      - path: ./gateway/oidc.env
        required: false
    volumes:
      - ./gateway:/gateway:ro
      # The chat part's budget database. The gateway writes it (the rest of gateway/ is read
      # only), so it keeps each household budget's running count across restarts.
      - ./gateway/llm:/llm
      - ./tls:/etc/kia-tls:ro

  # The front door's identity provider (Authelia; the frontdoor part, docs/front-door.md): it
  # holds the household's accounts, so one login covers kia's pages. scripts/frontdoor.sh writes
  # its settings and the account into frontdoor/. It's on the gateway's network only, with no
  # published port: the gateway is the only way to reach it, and puts a login in front of the
  # Dashboard. It writes its own database in frontdoor/ (/config).
  # Authelia's root filesystem is writable, unlike the rest of the stack: its startup checks
  # fail with a read-only root and it won't start. It still runs as the stack's user (so the
  # files it writes stay yours, not root's), drops all capabilities, gets no new privileges,
  # and has no published port, so only the gateway reaches it on the internal network. It
  # writes only its own database, in frontdoor/.
  authelia:
    profiles: ["frontdoor"]
    image: ${KIA_AUTHELIA_IMAGE:-authelia/authelia:4.39.28}
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
    networks: [gateway]
    volumes:
      - ./frontdoor:/config

  # The front door's account store (LLDAP; the frontdoor part, docs/front-door.md): a small
  # directory the identity provider checks passwords against, so a Dashboard page can add and
  # remove household members. On the gateway network only, with no published port: the provider
  # reaches it over LDAP (3890) and kia over its API (17170) for the account page. It keeps its
  # own database in a volume; its secrets come from files in frontdoor/secrets. Like the provider
  # it sets its own user through UID/GID rather than the stack's user override, so it can own that
  # database.
  lldap:
    profiles: ["frontdoor"]
    image: ${KIA_LLDAP_IMAGE:-lldap/lldap:v0.6.3}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    environment:
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
      TZ: ${TZ:-}
      LLDAP_LDAP_BASE_DN: dc=kia,dc=lan
      LLDAP_JWT_SECRET_FILE: /frontdoor/secrets/lldap-jwt-secret
      LLDAP_KEY_SEED_FILE: /frontdoor/secrets/lldap-key-seed
    # The LLDAP admin password, written by scripts/frontdoor.sh (the provider binds with it too).
    env_file:
      - path: ./frontdoor/lldap.env
        required: false
    networks: [gateway]
    volumes:
      - ${KIA_LLDAP_DATA:-./lldap/data}:/data
      - ./frontdoor:/frontdoor:ro

# Docker volumes for Plex's, Jellyfin's, and Grafana's databases on a Mac, where a folder
# shared from the Mac into Docker's Linux machine breaks Plex's database within minutes.
# KIA_PLEX_CONFIG=plex-config, KIA_JELLYFIN_CONFIG=jellyfin-config, and
# KIA_GRAFANA_DATA=grafana-data use them (scripts/install.sh sets them on a Mac). On Linux,
# the folders in the kia folder are fine.
volumes:
  plex-config:
  jellyfin-config:
  grafana-data:
  lldap-data:

# The gateway part's network: the gateway, kia, its web server, and (with the front door) the
# identity provider only, so Plex, Threadfin, and the rest can't reach the gateway or the login
# except through the gateway's published port, like any device.
networks:
  default:
  gateway:
