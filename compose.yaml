# Runs kia and a small web server that shares output/ with Kodi.
# Settings come from .env: copy .env.example to .env, edit it, then run
#   docker compose up -d --build
#
# Both containers run locked down: no extra privileges, a read-only system, and write
# access only to the folders they need. kia runs iptv-org's guide downloader, which is
# third-party code, so it can't change kia's own files or settings.
services:
  kia:
    build:
      context: .
      args:
        NODE_IMAGE: ${KIA_NODE_IMAGE:-node:lts-alpine}
    image: kodi-iptv-assistant:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      KIA_PUBLIC_URL: ${KIA_PUBLIC_URL:-}
      KIA_SOURCES_FILE: ${KIA_SOURCES_FILE:-}
      KIA_PROFILES_FILE: ${KIA_PROFILES_FILE:-}
      KIA_RUN_ON_START: ${KIA_RUN_ON_START:-}
      KIA_GUIDE_REFRESH_HOURS: ${KIA_GUIDE_REFRESH_HOURS:-}
      KIA_UPSTREAM_URL: ${KIA_UPSTREAM_URL:-}
      KIA_UPSTREAM_FALLBACK: ${KIA_UPSTREAM_FALLBACK:-}
      KIA_NTFY_URL: ${KIA_NTFY_URL:-}
      KIA_ALERT_COMMAND: ${KIA_ALERT_COMMAND:-}
      KIA_ALERT_EVENTS: ${KIA_ALERT_EVENTS:-}
      # Optional; empty means use the setting in kia.toml.
      KIA_EPG_DAYS: ${KIA_EPG_DAYS:-}
      KIA_PARALLEL_SITES: ${KIA_PARALLEL_SITES:-}
      KIA_CHECK_CONCURRENCY: ${KIA_CHECK_CONCURRENCY:-}
      KIA_EXCLUDE_SITES: ${KIA_EXCLUDE_SITES:-}
      KIA_EXCLUDE_GROUPS: ${KIA_EXCLUDE_GROUPS:-}
      KIA_PLACEHOLDERS: ${KIA_PLACEHOLDERS:-}
      KIA_RADIO_PLACEHOLDERS: ${KIA_RADIO_PLACEHOLDERS:-}
      KIA_EPG_GIT_URL: ${KIA_EPG_GIT_URL:-}
      KIA_EPG_GIT_REF: ${KIA_EPG_GIT_REF:-}
    # Hard cap so a runaway guide grabber is killed instead of exhausting the host.
    mem_limit: ${KIA_MEMORY_LIMIT:-4g}
    command: ["daemon", "--at", "${KIA_RUN_AT:-04:00}"]
    volumes:
      # The project folder (kia.toml, your sources file, local playlists) is read-only.
      - ./:/data:ro
      # The folders kia writes to.
      - ./output:/data/output
      - ./state:/data/state
      - ./work:/data/work
      - ./vendor:/data/vendor

  web:
    image: ${KIA_NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    # nginx starts as root to open the port, then switches to its own user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      # KIA_BIND=127.0.0.1 keeps the server to this machine (e.g. Kodi on the same laptop).
      - "${KIA_BIND:-0.0.0.0}:${KIA_PORT:-8780}:80"
    volumes:
      # Only the results; nothing else in the project folder is visible to the web server.
      - ./output:/srv/output:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
