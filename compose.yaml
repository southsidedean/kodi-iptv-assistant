# Copy .env.example to .env and edit it, then: docker compose up -d --build
services:
  kia:
    build: .
    image: kodi-iptv-assistant:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      KIA_PUBLIC_URL: ${KIA_PUBLIC_URL:-}
    command: ["daemon", "--at", "${KIA_RUN_AT:-04:00}"]
    volumes:
      # kia.toml, sources.txt, and the output/, state/, work/, vendor/ folders.
      - ./:/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${KIA_PORT:-8780}:80"
    volumes:
      - ./:/srv:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
