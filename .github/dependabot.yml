# Keeps the actions in .github/workflows up to date (they're pinned to exact commits).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all of them, and only for releases at least a week old.
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
