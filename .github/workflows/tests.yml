name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new "latest" Node.js or nginx image that breaks the build shows up even
  # in a quiet week.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Each push to main gets a run
# of its own, so none is skipped when merges come close together.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python kia supports, and the newest release.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # For the Pluto TV relay's remux tests, which are skipped without it.
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - name: pytest, with coverage (kia's lines the tests never run are listed, for reading, not enforced)
        run: python -m pytest -q --cov=kia --cov-report=term-missing:skip-covered

  # The scripts' Darwin branches under macOS's own sh and tools, which the stand-ins on Linux
  # only imitate. Not a required check.
  pytest-macos:
    name: pytest (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    name: lint and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - name: ruff (bugs and risky code; settings in pyproject.toml)
        run: ruff check src tests scripts tools
      - name: bandit (security issues in kia's code)
        run: bandit -q -c pyproject.toml -r src
      - name: shellcheck (the install and service scripts)
        run: shellcheck scripts/*.sh deploy/*.sh
      - name: zizmor (these workflows)
        run: zizmor --min-severity medium .github/workflows

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose.yaml is valid with the example settings, with every set of profiles
        run: |
          cp .env.example .env
          for profiles in "" plex plex,plex-2 plex,plex-server jellyfin-server plex,plex-server,jellyfin-server monitoring monitoring,monitoring-node monitoring,monitoring-gpu,monitoring-disks plex,plex-2,plex-server,jellyfin-server,monitoring,monitoring-node,monitoring-gpu,monitoring-disks; do
            echo "COMPOSE_PROFILES=$profiles"
            COMPOSE_PROFILES="$profiles" docker compose config --quiet
          done
      - name: kia image builds from the latest base image
        run: docker compose build --pull kia
      - name: kia runs in the image
        run: docker compose run --rm --no-deps kia --version
      - name: no fixable high or critical CVEs in the image (known exceptions in .trivyignore)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kodi-iptv-assistant:latest
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      # A second opinion: Grype matches some packages Trivy doesn't (it found a high ffmpeg CVE
      # Trivy missed). For reading only: it doesn't fail the build, since many of its matches
      # have no fix yet.
      - name: Grype (report only)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kodi-iptv-assistant:latest
          fail-build: false
          severity-cutoff: high
          output-format: table
          output-file: grype.txt
      - name: Grype's findings
        if: always()
        run: |
          if [ -f grype.txt ]; then
            cat grype.txt
            { echo '### Grype (report only)'; echo '```'; cat grype.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kia's whole stack, one full refresh with a test stream, and what it serves afterwards.
      - run: scripts/smoke-test.sh
