name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new "latest" Node.js or nginx image that breaks the build shows up even
  # in a quiet week.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python kia supports, and the newest release.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    name: lint and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install -e ".[dev]" zizmor
      - name: ruff (bugs and risky code; settings in pyproject.toml)
        run: ruff check src tests
      - name: bandit (security issues in kia's code)
        run: bandit -q -c pyproject.toml -r src
      - name: shellcheck (the install and service scripts)
        run: shellcheck scripts/*.sh deploy/*.sh
      - name: zizmor (these workflows)
        run: zizmor --min-severity medium .github/workflows

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose.yaml is valid with the example settings
        run: cp .env.example .env && docker compose config --quiet
      - name: kia image builds from the latest base image
        run: docker compose build --pull kia
      - name: kia runs in the image
        run: docker compose run --rm --no-deps kia --version
      - name: no fixable high or critical CVEs in the image (known exceptions in .trivyignore)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kodi-iptv-assistant:latest
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
