name: image scan

# Scans the published image (ghcr.io/southsidedean/kodi-iptv-assistant:latest) every week
# and after each release, so CVEs found after a release show up in the repository's
# Security tab (Code scanning) even when nothing in kia changed.

on:
  schedule:
    - cron: "41 6 * * 2"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
      - name: Show the results in the Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: image
